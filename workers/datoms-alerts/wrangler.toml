name = "dropx-datoms-alerts"
account_id = "ab2dba58727809ae8bf0a21edb5fe7b8"
main = "src/index.mjs"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Cron disabled on purpose: Cloudflare scheduled Workers often egress from US
# colos (login alert IPs). OpsPulse Vercel cron (bom1) owns the 5-minute poll.
[triggers]
crons = []

[vars]
DATOMS_CUSTOMER_ID = "17428"
DATOMS_APPLICATION_ID = "16"
COMPANY_ID = "43866344-b550-4e8a-9a2d-9d23f3d8a997"

[[kv_namespaces]]
binding = "ALERT_DEDUPE"
id = "becf2d9f9e7e46acaa875f6c9aa8f99f"
