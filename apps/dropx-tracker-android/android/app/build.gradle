apply plugin: 'com.android.application'

import java.util.Properties

// Real signing secrets live in keystore.properties (gitignored, one directory up) — see
// keystore.properties.example for the shape and README.md's Signing section for where the
// actual keystore file lives. Missing entirely on a machine that only needs debug builds
// (CI running instrumented tests, a dev's first checkout before they've copied the file).
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    // Ships as an update to the existing live Play Store listing (package com.dropxlogistics.one,
    // developer "DropX One" in Play Console) rather than as a new, separate app. namespace
    // (the Java package, matching src/main/java/com/dropxlogistics/one/) and applicationId
    // below are kept identical on purpose — an earlier version of this build let them diverge
    // (namespace stayed "onetracker" while applicationId was "one"), which caused a confusing
    // debug/release package mismatch. Signing must use that listing's original upload key
    // (see android/keystore.properties, gitignored).
    namespace "com.dropxlogistics.one"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.dropxlogistics.one"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Highest versionCode ever uploaded to this listing was 9 (4.0.3, rejected 31 Aug 2026
        // for missing background-location disclosure — this app's consent dialog fixes that).
        // Must strictly exceed 9 even though that release was never approved. 33 (4.5.6) was
        // approved 24 Sept 2026 after the background-location policy form was fixed. 34 (4.5.7)
        // was rejected the same day for Device and Network Abuse policy (see
        // apps/connect/app/(workspace)/layout.tsx's showAppInstallCard doc for the actual fix) —
        // per Google's own rejection instructions, this version must be a strictly higher
        // versionCode set to 100% rollout to override/deactivate that noncompliant APK.
        versionCode 35
        versionName "4.5.8"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // DropxOnePlugin's always-on-in-background location tracking.
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'androidx.work:work-runtime:2.9.1'

    // DropxMessagingService (notifications/): @capacitor/push-notifications already bundles
    // firebase-messaging transitively through its own AAR, but that doesn't expose the classes
    // to our own app-module source — FirebaseMessagingService/RemoteMessage aren't resolvable
    // without this being a direct dependency here too.
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
