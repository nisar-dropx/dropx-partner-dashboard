<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport" />
    <meta content="#15152f" name="theme-color" />
    <title>DropX One · Offline</title>
    <style>
      *{box-sizing:border-box}body{display:grid;min-height:100dvh;margin:0;padding:28px;place-items:center;background:linear-gradient(145deg,#111a35,#241a4b 55%,#7e245d);color:#fff;font-family:system-ui,-apple-system,sans-serif}.card{width:min(100%,390px);padding:30px;border:1px solid #ffffff24;border-radius:28px;background:#ffffff12;box-shadow:0 28px 70px #0004;backdrop-filter:blur(16px)}img{width:142px;height:auto;padding:8px 10px;border-radius:12px;background:#fff}h1{margin:34px 0 10px;font-size:30px;letter-spacing:-.04em}p{margin:0 0 26px;color:#ffffffb8;line-height:1.55}button{width:100%;height:50px;border:0;border-radius:14px;background:linear-gradient(115deg,#ff7b35,#f04b2f 48%,#dc2f72);color:#fff;font:700 15px system-ui;box-shadow:0 12px 28px #6a102955}
    </style>
  </head>
  <body>
    <main class="card">
      <img alt="DropX" src="/dropx-logo.png" />
      <h1>You’re offline</h1>
      <p>DropX One keeps personal and attendance data live, so reconnect to continue securely.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
